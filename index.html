<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>合成大杨波</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1200px 700px at 50% -10%, #334155, #0f172a);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
  }
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 1100px;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
  }
  .title {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 2px;
    text-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  .stats { display: flex; gap: 10px; }
  .stat {
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px;
    padding: 8px 14px;
    text-align: center;
    min-width: 76px;
  }
  .stat .label { font-size: 11px; opacity: .7; }
  .stat .value { font-size: 18px; font-weight: 700; }
  .body {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    justify-content: center;
    width: 100%;
    flex-wrap: wrap;
  }
  .stage {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 16px 48px rgba(0,0,0,.55);
    width: 100%;
    max-width: 720px;
    background: #000;
  }
  canvas#game { display: block; width: 100%; height: auto; touch-action: none; }
  .side {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 170px;
  }
  .panel {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px;
    padding: 12px;
    text-align: center;
  }
  .panel .label { font-size: 11px; opacity: .7; margin-bottom: 6px; }
  .panel canvas { display: block; margin: 0 auto; }
  canvas#nextCanvas { width: 76px; height: 76px; }
  canvas#galleryCanvas { width: 138px; height: 230px; }
  .inp {
    width: 100%;
    box-sizing: border-box;
    padding: 7px 8px;
    margin-bottom: 8px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.12);
    color: #fff;
    font-size: 13px;
    outline: none;
  }
  .inp:focus { border-color: #f59e0b; }
  .inp::placeholder { color: rgba(255,255,255,.5); }
  .login-btns { display: flex; gap: 8px; }
  .login-msg { font-size: 11px; margin-top: 8px; min-height: 14px; opacity: .85; }
  .who { font-size: 12px; margin-bottom: 8px; word-break: break-all; }
  button {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 11px 0;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(239,68,68,.4);
    transition: transform .08s ease, filter .15s ease;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: scale(.96); }
  button.mini { padding: 7px 0; font-size: 13px; border-radius: 9px; }
  .hint {
    font-size: 12px;
    opacity: .7;
    text-align: center;
    line-height: 1.6;
  }
  .board { max-height: 260px; overflow-y: auto; text-align: left; font-size: 12px; }
  .board .row { display: flex; gap: 6px; padding: 3px 4px; border-bottom: 1px solid rgba(255,255,255,.06); border-radius: 6px; }
  .board .row.me { background: rgba(245,158,11,.18); }
  .board .rk { width: 18px; color: #f59e0b; font-weight: 700; text-align: right; flex-shrink: 0; }
  .board .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board .sc { font-weight: 700; flex-shrink: 0; }
  .board .empty { font-size: 11px; opacity: .6; padding: 6px 2px; }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    backdrop-filter: blur(2px);
  }
  .overlay.hidden { display: none; }
  .overlay-box { text-align: center; padding: 24px; }
  .overlay-title { font-size: 30px; font-weight: 800; margin-bottom: 8px; letter-spacing: 2px; }
  .overlay-score { font-size: 16px; opacity: .9; margin-bottom: 18px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">合成大杨波</div>
      <div class="stats">
        <div class="stat"><div class="label">得分</div><div class="value" id="score">0</div></div>
        <div class="stat"><div class="label">最高</div><div class="value" id="best">0</div></div>
      </div>
    </div>
    <div class="body">
      <div class="side side-left">
        <div class="panel">
          <div class="label">当前用户</div>
          <div id="userInfo">
            <div class="who" id="whoAmI"></div>
            <button class="mini" id="btnLogout">退出登录</button>
          </div>
        </div>
        <div class="panel">
          <div class="label">排行榜</div>
          <div class="board" id="board"></div>
        </div>
      </div>
      <div class="stage">
        <canvas id="game"></canvas>
        <div class="overlay hidden" id="overlay">
          <div class="overlay-box">
            <div class="overlay-title">游戏结束</div>
            <div class="overlay-score" id="overlayScore"></div>
            <button id="restart">再来一局</button>
          </div>
        </div>
      </div>
      <div class="side side-right">
        <div class="panel">
          <div class="label">下一个</div>
          <canvas id="nextCanvas" width="140" height="140"></canvas>
        </div>
        <div class="panel">
          <div class="label">合成图鉴</div>
          <canvas id="galleryCanvas"></canvas>
        </div>
        <button id="restart2">重新开始</button>
        <div class="hint">点击 / 触摸投放杨波<br>相同杨波会合成更大的杨波<br>1 → 15 从小到大</div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="store.js"></script>
<script>
(function () {
  "use strict";

  // ---------- 云端会话与资料（Supabase，见 store.js） ----------
  var store = window.shalong_store;
  var currentUser = null;   // 当前登录用户（Supabase User）
  var myProfile = null;     // 当前用户资料 {username, best_score, unlocked}
  // 登录校验在底部 boot() 异步完成：未登录会跳转 login.html

  // ---------- 基础常量 ----------
  var W = 720, H = 720;              // 逻辑画布尺寸（更宽更矮）
  var DANGER_Y = 150;                // 游戏结束警戒线
  var G = 2000;                      // 重力加速度 px/s^2
  var E = 0.12;                      // 弹性系数（更低，减少弹跳）
  var STEP = 1 / 120;                // 物理步长
  var SOLVER_ITERS = 18;             // 碰撞求解迭代次数
  var RELAX = 0.6;                   // 位置修正松弛系数
  var DANGER_TIME = 10.0;            // 越线持续 10 秒判负
  var SLEEP_SPEED = 20;              // 低于此速度开始计时入睡
  var SLEEP_TIME = 0.28;             // 持续低速多久后入睡（秒）
  var FRESH_TIME = 0.5;              // 新下放球的危险判定保护期（秒）

  // 等级 1..15 的半径（从小到大）
  var RADII = [0, 24, 33, 42, 52, 62, 73, 84, 96, 110, 123, 136, 149, 162, 175, 188];
  // 等级 1..15 的主题色
  var COLORS = [null,
    '#ef4444', '#f97316', '#eab308', '#84cc16', '#22c55e',
    '#10b981', '#14b8a6', '#0ea5e9', '#3b82f6', '#6366f1',
    '#8b5cf6', '#a855f7', '#d946ef', '#ec4899', '#f43f5e'];
  // 合成得到的分数（第 L 级 = 2^(L-1)）
  var POINTS = [0];
  for (var _l = 1; _l <= 15; _l++) POINTS.push(Math.pow(2, _l - 1));

  // 素材路径（1..15 均为 png；图片缺失时自动用占位图）
  var IMG_PATHS = {};
  for (var _lv = 1; _lv <= 15; _lv++) IMG_PATHS[_lv] = '素材/' + _lv + '.png';

  function logout() {
    store.signOut().then(function () {
      window.location.replace('login.html');
    }).catch(function () {
      window.location.replace('login.html');
    });
  }
  // 记录合成图鉴：本地立即更新，后台同步云端
  function unlock(level) {
    if (!myProfile) return;
    if (!myProfile.unlocked[level]) {
      myProfile.unlocked[level] = true;
      renderGallery();
      store.saveUnlocked(currentUser.id, myProfile.unlocked).catch(function () {});
    }
  }
  // 刷新顶部用户信息 + 图鉴 + 排行榜
  function refreshUI() {
    whoEl.textContent = '你好，' + myProfile.username + '（最高 ' + myProfile.best_score + '）';
    bestEl.textContent = myProfile.best_score;
    renderGallery();
    refreshBoard();
  }
  function refreshBoard() {
    store.loadBoard().then(function (rows) {
      var html = '';
      if (!rows || !rows.length) {
        html = '<div class="empty">还没有其他玩家上榜</div>';
      } else {
        var top = rows.slice(0, 10);
        for (var i = 0; i < top.length; i++) {
          var it = top[i];
          var cls = (myProfile && it.username === myProfile.username) ? ' me' : '';
          html += '<div class="row' + cls + '"><span class="rk">' + (i + 1) + '</span><span class="nm">' + store.esc(it.username) + '</span><span class="sc">' + it.best_score + '</span></div>';
        }
      }
      boardEl.innerHTML = html;
    }).catch(function () {
      boardEl.innerHTML = '<div class="empty">排行榜加载失败</div>';
    });
  }

  // ---------- DOM ----------
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var nextCanvas = document.getElementById('nextCanvas');
  var nextCtx = nextCanvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var overlayScore = document.getElementById('overlayScore');
  var userInfoEl = document.getElementById('userInfo');
  var whoEl = document.getElementById('whoAmI');
  var boardEl = document.getElementById('board');
  var galleryCanvas = document.getElementById('galleryCanvas');

  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  galleryCanvas.width = 138 * dpr;
  galleryCanvas.height = 230 * dpr;
  var galleryCtx = galleryCanvas.getContext('2d');
  galleryCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // ---------- 状态 ----------
  var fruits = [];      // {level, r, x, y, vx, vy, sleeping, stillTime, highTime, fresh}
  var particles = [];   // 合成粒子
  var texts = [];       // 合成飘分
  var imgs = {};        // level -> Image (或 null 表示占位图)
  var score = 0;
  var currentLevel = 1; // 当前即将下放的杨波等级
  var nextLevel = 1;    // 下下个杨波等级（侧栏「下一个」显示）
  var aimX = W / 2;
  var gameOver = false;
  var lastDropReal = 0;
  var dangerLeft = null;   // 危险倒计时剩余秒数（null=无危险）

  // ---------- 工具 ----------
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function randomLevel() {
    var r = Math.random();
    if (r < 0.28) return 1;
    if (r < 0.52) return 2;
    if (r < 0.72) return 3;
    if (r < 0.86) return 4;
    if (r < 0.95) return 5;
    if (r < 0.985) return 6;
    return 7;
  }

  // ---------- 图片加载 ----------
  for (var lv = 1; lv <= 15; lv++) {
    (function (level) {
      var img = new Image();
      img.onload = function () { imgs[level] = img; };
      img.onerror = function () { imgs[level] = null; }; // 缺失时使用占位图
      img.src = IMG_PATHS[level];
    })(lv);
  }

  // ---------- 音频（可选，失败静默） ----------
  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      } catch (e) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playPop(level) {
    if (!audioCtx) return;
    try {
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = 200 + level * 45;
      o.connect(g);
      g.connect(audioCtx.destination);
      var t = audioCtx.currentTime;
      g.gain.setValueAtTime(0.14, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
      o.start(t);
      o.stop(t + 0.16);
    } catch (e) {}
  }

  // ---------- 合成特效 ----------
  function spawnMergeFx(x, y, level) {
    var col = COLORS[level];
    for (var k = 0; k < 10; k++) {
      var ang = Math.random() * Math.PI * 2;
      var spd = 70 + Math.random() * 180;
      particles.push({
        x: x, y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 40,
        r: 2 + Math.random() * 4,
        col: col,
        t: 0, life: 0.35 + Math.random() * 0.2
      });
    }
    texts.push({ x: x, y: y - 8, text: '+' + POINTS[level], t: 0, life: 0.85 });
  }

  // ---------- 游戏流程 ----------
  function drop() {
    if (gameOver) return;
    ensureAudio();
    var now = performance.now();
    if (now - lastDropReal < 140) return; // 防止连点堆叠
    lastDropReal = now;

    var level = currentLevel;
    var r = RADII[level];
    var x = clamp(aimX, r, W - r);
    fruits.push({ level: level, r: r, x: x, y: r + 2, vx: 0, vy: 0, sleeping: false, stillTime: 0, highTime: 0, fresh: FRESH_TIME });
    wakeNear(x, r + 2, r * 4);
    currentLevel = nextLevel;
    nextLevel = randomLevel();
    drawNext();
  }

  function restart() {
    fruits = [];
    particles = [];
    texts = [];
    score = 0;
    gameOver = false;
    dangerLeft = null;
    currentLevel = randomLevel();
    nextLevel = randomLevel();
    aimX = W / 2;
    scoreEl.textContent = '0';
    overlay.classList.add('hidden');
    drawNext();
  }

  function gameOverNow() {
    gameOver = true;
    if (myProfile && score > myProfile.best_score) {
      myProfile.best_score = score;
      bestEl.textContent = score;
      whoEl.textContent = '你好，' + myProfile.username + '（最高 ' + score + '）';
      store.updateBest(currentUser.id, score).catch(function () {});
      refreshBoard();
    } else if (myProfile) {
      bestEl.textContent = myProfile.best_score;
    }
    overlayScore.textContent = '本局得分：' + score;
    overlay.classList.remove('hidden');
  }

  // ---------- 物理 ----------
  function integrate(dt) {
    for (var i = 0; i < fruits.length; i++) {
      var f = fruits[i];
      if (f.sleeping) continue;
      f.vy += G * dt;
      f.vx *= Math.max(0, 1 - 0.5 * dt); // 空气阻力
      f.x += f.vx * dt;
      f.y += f.vy * dt;

      // 左右墙
      if (f.x < f.r) { f.x = f.r; if (f.vx < 0) f.vx = -f.vx * E; }
      else if (f.x > W - f.r) { f.x = W - f.r; if (f.vx > 0) f.vx = -f.vx * E; }
      // 地面
      if (f.y > H - f.r) {
        f.y = H - f.r;
        if (f.vy > 0) f.vy = -f.vy * E;
        f.vx *= Math.max(0, 1 - 6 * dt); // 地面摩擦
      }
      // 天花板
      if (f.y < f.r) { f.y = f.r; if (f.vy < 0) f.vy = -f.vy * E; }
    }
  }

  function tryMerge() {
    for (var i = 0; i < fruits.length; i++) {
      for (var j = i + 1; j < fruits.length; j++) {
        var a = fruits[i], b = fruits[j];
        if (a.level !== b.level || a.level >= 15) continue;
        var dx = b.x - a.x, dy = b.y - a.y;
        var min = a.r + b.r;
        if (dx * dx + dy * dy < min * min) {
          // 合成
          var level = a.level + 1;
          var r = RADII[level];
          var x = clamp((a.x + b.x) / 2, r, W - r);
          var y = clamp((a.y + b.y) / 2, r, H - r);
          fruits.splice(Math.max(i, j), 1);
          fruits.splice(Math.min(i, j), 1);
          fruits.push({
            level: level, r: r, x: x, y: y,
            vx: (a.vx + b.vx) / 2, vy: (a.vy + b.vy) / 2,
            sleeping: false, stillTime: 0,
            // 合成出的球继承原球的危险计时与保护期，避免堆顶连续合成导致永不判负
            highTime: Math.max(a.highTime, b.highTime),
            fresh: Math.max(a.fresh, b.fresh)
          });
          wakeNear(x, y, r * 4);
          score += POINTS[level];
          scoreEl.textContent = score;
          spawnMergeFx(x, y, level);
          playPop(level);
          unlock(level); // 记录到当前用户的合成图鉴
          return true;
        }
      }
    }
    return false;
  }

  function resolveCollision(a, b) {
    var dx = b.x - a.x, dy = b.y - a.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var min = a.r + b.r;
    if (dist >= min) return;
    // 双方都在睡且已接触：做完全的位置分离（无速度所以不会过冲），
    // 不唤醒也不施加冲量——避免「穿模卡在一起」且不引发抖动
    if (a.sleeping && b.sleeping) {
      var ov = min - dist;
      if (dist < 0.0001) { dx = 0; dy = 0.01; dist = 0.01; }
      var nx2 = dx / dist, ny2 = dy / dist;
      var ia = 1 / (a.r * a.r), ib = 1 / (b.r * b.r), tot = ia + ib;
      a.x -= nx2 * ov * (ia / tot);
      a.y -= ny2 * ov * (ia / tot);
      b.x += nx2 * ov * (ib / tot);
      b.y += ny2 * ov * (ib / tot);
      return;
    }
    // 发生碰撞即唤醒双方
    a.sleeping = false; a.stillTime = 0;
    b.sleeping = false; b.stillTime = 0;
    if (dist < 0.0001) { dx = 0; dy = 0.01; dist = 0.01; }
    var nx = dx / dist, ny = dy / dist;
    var overlap = min - dist;
    var invA = 1 / (a.r * a.r), invB = 1 / (b.r * b.r);
    var total = invA + invB;
    // 位置修正（带松弛，避免过冲震荡）
    var corr = overlap * RELAX;
    a.x -= nx * corr * (invA / total);
    a.y -= ny * corr * (invA / total);
    b.x += nx * corr * (invB / total);
    b.y += ny * corr * (invB / total);
    // 冲量
    var rvx = b.vx - a.vx, rvy = b.vy - a.vy;
    var vn = rvx * nx + rvy * ny;
    if (vn < 0) {
      var j = -(1 + E) * vn / total;
      a.vx -= j * invA * nx; a.vy -= j * invA * ny;
      b.vx += j * invB * nx; b.vy += j * invB * ny;
    }
  }

  function resolveAll() {
    for (var i = 0; i < fruits.length; i++) {
      for (var j = i + 1; j < fruits.length; j++) {
        resolveCollision(fruits[i], fruits[j]);
      }
    }
  }

  function wakeNear(x, y, radius) {
    var rr = radius * radius;
    for (var i = 0; i < fruits.length; i++) {
      var f = fruits[i];
      var dx = f.x - x, dy = f.y - y;
      if (dx * dx + dy * dy < rr) { f.sleeping = false; f.stillTime = 0; }
    }
  }

  function enforceBounds() {
    for (var i = 0; i < fruits.length; i++) {
      var f = fruits[i];
      if (f.x < f.r) { f.x = f.r; if (f.vx < 0) f.vx = 0; }
      else if (f.x > W - f.r) { f.x = W - f.r; if (f.vx > 0) f.vx = 0; }
      if (f.y < f.r) { f.y = f.r; if (f.vy < 0) f.vy = 0; }
      if (f.y > H - f.r) { f.y = H - f.r; if (f.vy > 0) f.vy = 0; }
    }
  }

  function applySleep(dt) {
    for (var i = 0; i < fruits.length; i++) {
      var f = fruits[i];
      var sp = Math.sqrt(f.vx * f.vx + f.vy * f.vy);
      if (sp < SLEEP_SPEED) {
        f.stillTime += dt;
        if (f.stillTime >= SLEEP_TIME) {
          f.sleeping = true;
          f.vx = 0; f.vy = 0;
        }
      } else {
        f.stillTime = 0;
        f.sleeping = false;
      }
    }
  }

  function updateDanger(dt) {
    // 全局倒计时：只要有任何图形（部分）越过警戒线就开始倒数 10 秒，
    // 中途全部回到线以下则清零；连续 10 秒未回去即判负。不要求图形稳定。
    var overflow = false;
    for (var i = 0; i < fruits.length; i++) {
      var f = fruits[i];
      if (f.fresh > 0) { f.fresh -= dt; continue; } // 刚下放的球有短暂保护期，避免下落瞬间误触发
      if (f.y - f.r < DANGER_Y) { overflow = true; break; }
    }
    if (overflow) {
      if (dangerLeft === null) dangerLeft = DANGER_TIME;
      dangerLeft -= dt;
      if (dangerLeft <= 0) { gameOverNow(); return; }
    } else {
      dangerLeft = null;
    }
  }

  function step(dt) {
    integrate(dt);
    var guard = 0;
    while (tryMerge() && guard++ < 80) {}
    for (var it = 0; it < SOLVER_ITERS; it++) resolveAll();
    enforceBounds();
    applySleep(dt);
    updateDanger(dt);
  }

  // ---------- 渲染 ----------
  function drawFruitAt(c, x, y, r, level) {
    var img = imgs[level];
    c.save();
    c.beginPath();
    c.arc(x, y, r, 0, Math.PI * 2);
    c.closePath();
    c.clip();
    if (img && img.complete && img.naturalWidth) {
      var iw = img.naturalWidth, ih = img.naturalHeight;
      var s = Math.max(iw, ih);
      var sx = (iw - s) / 2, sy = (ih - s) / 2;
      c.drawImage(img, sx, sy, s, s, x - r, y - r, r * 2, r * 2);
    } else {
      var col = COLORS[level];
      var grd = c.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
      grd.addColorStop(0, 'rgba(255,255,255,.75)');
      grd.addColorStop(1, col);
      c.fillStyle = grd;
      c.fillRect(x - r, y - r, r * 2, r * 2);
      c.fillStyle = '#fff';
      c.font = 'bold ' + Math.round(r * 0.9) + 'px "Segoe UI", "Microsoft YaHei", sans-serif';
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.fillText(String(level), x, y + 1);
    }
    c.restore();
    c.beginPath();
    c.arc(x, y, r, 0, Math.PI * 2);
    c.lineWidth = 3;
    c.strokeStyle = COLORS[level];
    c.stroke();
  }

  function drawNext() {
    nextCtx.clearRect(0, 0, 140, 140);
    var r = RADII[nextLevel];
    var scale = r > 64 ? 64 / r : 1;
    drawFruitAt(nextCtx, 70, 70, r * scale, nextLevel);
  }

  // 合成图鉴：合成过的显示图像，未合成显示问号
  function renderGallery() {
    galleryCtx.clearRect(0, 0, 138, 230);
    var cell = 40, gap = 6, x0 = 6, y0 = 6;
    for (var lv = 1; lv <= 15; lv++) {
      var col = (lv - 1) % 3, row = Math.floor((lv - 1) / 3);
      var cx = x0 + col * (cell + gap) + cell / 2;
      var cy = y0 + row * (cell + gap) + cell / 2;
      // 等级 1 是基础杨波（投放即有），永远显示图像；其余等级看合成记录
      var unlockedFlag = (lv === 1) || (myProfile && myProfile.unlocked && myProfile.unlocked[lv]);
      if (unlockedFlag) {
        drawFruitAt(galleryCtx, cx, cy, 18, lv);
      } else {
        galleryCtx.beginPath();
        galleryCtx.arc(cx, cy, 18, 0, Math.PI * 2);
        galleryCtx.fillStyle = 'rgba(148,163,184,.18)';
        galleryCtx.fill();
        galleryCtx.strokeStyle = 'rgba(148,163,184,.55)';
        galleryCtx.lineWidth = 1.5;
        galleryCtx.stroke();
        galleryCtx.fillStyle = 'rgba(148,163,184,.9)';
        galleryCtx.font = 'bold 20px "Segoe UI", "Microsoft YaHei", sans-serif';
        galleryCtx.textAlign = 'center';
        galleryCtx.textBaseline = 'middle';
        galleryCtx.fillText('?', cx, cy + 1);
      }
      // 等级角标（右下）
      galleryCtx.fillStyle = 'rgba(15,23,42,.55)';
      galleryCtx.beginPath();
      galleryCtx.arc(cx + 15, cy + 15, 8, 0, Math.PI * 2);
      galleryCtx.fill();
      galleryCtx.fillStyle = '#fff';
      galleryCtx.font = 'bold 9px "Segoe UI", "Microsoft YaHei", sans-serif';
      galleryCtx.textAlign = 'center';
      galleryCtx.textBaseline = 'middle';
      galleryCtx.fillText(String(lv), cx + 15, cy + 15);
    }
  }

  function render() {
    // 背景
    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#f8fafc');
    bg.addColorStop(1, '#e2e8f0');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // 警戒线上方红色提示
    var danger = ctx.createLinearGradient(0, 0, 0, DANGER_Y);
    danger.addColorStop(0, 'rgba(239,68,68,.16)');
    danger.addColorStop(1, 'rgba(239,68,68,0)');
    ctx.fillStyle = danger;
    ctx.fillRect(0, 0, W, DANGER_Y);

    // 容器边框（顶部圆角）
    ctx.beginPath();
    ctx.moveTo(14, H - 6);
    ctx.lineTo(14, 20);
    ctx.quadraticCurveTo(14, 6, 28, 6);
    ctx.lineTo(W - 28, 6);
    ctx.quadraticCurveTo(W - 14, 6, W - 14, 20);
    ctx.lineTo(W - 14, H - 6);
    ctx.lineWidth = 8;
    ctx.strokeStyle = 'rgba(100,116,139,.5)';
    ctx.stroke();

    // 警戒线
    ctx.setLineDash([10, 8]);
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(239,68,68,.7)';
    ctx.beginPath();
    ctx.moveTo(10, DANGER_Y);
    ctx.lineTo(W - 10, DANGER_Y);
    ctx.stroke();
    ctx.setLineDash([]);

    // 杨波
    for (var i = 0; i < fruits.length; i++) {
      var f = fruits[i];
      drawFruitAt(ctx, f.x, f.y, f.r, f.level);
    }

    // 粒子
    for (var p = 0; p < particles.length; p++) {
      var pt = particles[p];
      ctx.globalAlpha = Math.max(0, 1 - pt.t / pt.life);
      ctx.fillStyle = pt.col;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 飘分
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var t = 0; t < texts.length; t++) {
      var tx = texts[t];
      ctx.globalAlpha = Math.max(0, 1 - tx.t / tx.life);
      ctx.fillStyle = '#f97316';
      ctx.font = 'bold 22px "Segoe UI", "Microsoft YaHei", sans-serif';
      ctx.fillText(tx.text, tx.x, tx.y);
    }
    ctx.globalAlpha = 1;

    // 瞄准辅助与预览
    if (!gameOver) {
      var r = RADII[currentLevel];
      var px = clamp(aimX, r, W - r);
      ctx.setLineDash([4, 6]);
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(148,163,184,.7)';
      ctx.beginPath();
      ctx.moveTo(px, 10);
      ctx.lineTo(px, H - 10);
      ctx.stroke();
      ctx.setLineDash([]);
      drawFruitAt(ctx, px, r + 2, r, currentLevel);
    }

    // 危险倒计时提示（最上层）
    if (dangerLeft !== null && !gameOver) {
      var msg = '危险！' + dangerLeft.toFixed(1) + ' 秒后游戏结束';
      ctx.font = 'bold 22px "Segoe UI", "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      var tw = ctx.measureText(msg).width;
      var boxW = tw + 30, boxH = 40, boxX = W / 2 - boxW / 2, boxY = 12;
      ctx.fillStyle = 'rgba(220,38,38,.93)';
      ctx.beginPath();
      ctx.moveTo(boxX + 12, boxY);
      ctx.lineTo(boxX + boxW - 12, boxY);
      ctx.quadraticCurveTo(boxX + boxW, boxY, boxX + boxW, boxY + 12);
      ctx.lineTo(boxX + boxW, boxY + boxH - 12);
      ctx.quadraticCurveTo(boxX + boxW, boxY + boxH, boxX + boxW - 12, boxY + boxH);
      ctx.lineTo(boxX + 12, boxY + boxH);
      ctx.quadraticCurveTo(boxX, boxY + boxH, boxX, boxY + boxH - 12);
      ctx.lineTo(boxX, boxY + 12);
      ctx.quadraticCurveTo(boxX, boxY, boxX + 12, boxY);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillText(msg, W / 2, boxY + boxH / 2);
    }
  }

  // ---------- 特效更新 ----------
  function updateFx(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.t += dt;
      p.vy += 500 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.t >= p.life) particles.splice(i, 1);
    }
    for (var j = texts.length - 1; j >= 0; j--) {
      var tx = texts[j];
      tx.t += dt;
      tx.y -= 30 * dt;
      if (tx.t >= tx.life) texts.splice(j, 1);
    }
  }

  // ---------- 主循环 ----------
  var last = performance.now();
  var acc = 0;
  function loop(now) {
    var dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    acc += dt;
    while (acc >= STEP) {
      if (!gameOver) step(STEP);
      updateFx(STEP);
      acc -= STEP;
    }
    render();
    requestAnimationFrame(loop);
  }

  // ---------- 输入 ----------
  function getCanvasX(clientX) {
    var rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }
  canvas.addEventListener('pointermove', function (e) {
    aimX = clamp(getCanvasX(e.clientX), 0, W);
  });
  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    aimX = clamp(getCanvasX(e.clientX), 0, W);
    drop();
  });

  document.getElementById('restart').addEventListener('click', restart);
  document.getElementById('restart2').addEventListener('click', restart);
  document.getElementById('btnLogout').addEventListener('click', logout);

  // ---------- 启动（异步：先验证登录，再加载资料，最后开始游戏） ----------
  drawNext();
  store.getSession().then(function (user) {
    if (!user) { window.location.replace('login.html'); return null; }
    currentUser = user;
    return store.loadProfile(user.id).then(function (p) {
      if (p) return p;
      return store.ensureProfile(user); // 老用户补建资料
    });
  }).then(function (profile) {
    if (!profile) return; // 已跳转登录页
    myProfile = profile;
    currentLevel = randomLevel();
    nextLevel = randomLevel();
    refreshUI();
    requestAnimationFrame(loop);
  }).catch(function () {
    // 存储未配置或网络异常：回到登录页
    window.location.replace('login.html');
  });
})();
</script>
</body>
</html>
